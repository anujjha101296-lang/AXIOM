name: CI — Lint & Test

on:
  push:
    branches: ["main", "sprint/**", "fix/**", "cursor/**"]
  pull_request:
    branches: ["main"]

env:
  PYTHONPATH: .
  AXIOM_API_TOKEN: test_token
  JWT_SECRET_KEY: ci-test-secret
  DATABASE_URL: "sqlite:///:memory:"
  DB_PATH: ":memory:"
  LOG_FORMAT: console
  LOG_LEVEL: WARNING

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: pip install ruff mypy pydantic pydantic-settings

      - name: Run ruff
        run: ruff check axiom/ tests/

      - name: Run mypy
        run: mypy axiom/ --ignore-missing-imports --no-strict-optional

  test:
    name: Test (core + coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            fastapi uvicorn pydantic pydantic-settings \
            networkx sympy pylatexenc requests pypdf python-multipart \
            z3-solver anyio "httpx>=0.27.0,<0.28.0" \
            pytest pytest-cov pytest-anyio

      - name: Run core test suite with coverage
        run: |
          pytest tests/ --ignore=tests/e2e -v \
            --cov=axiom \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false

  ui:
    name: UI (lint + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Lint UI
        working-directory: ui
        run: npm run lint

      - name: Build UI
        working-directory: ui
        run: npm run build

  e2e-status:
    name: E2E status (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            fastapi uvicorn pydantic pydantic-settings \
            networkx sympy pylatexenc requests pypdf python-multipart \
            z3-solver anyio "httpx>=0.27.0,<0.28.0" \
            pytest pytest-anyio

      - name: Run e2e tests (known gaps)
        run: pytest tests/e2e -v --tb=no -q || true

      - name: Note e2e status
        run: echo "E2E failures document MDE API surface gap — see MASTER_PROGRESS.md"
