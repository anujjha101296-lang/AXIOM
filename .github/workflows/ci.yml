name: CI — Lint & Test

on:
  push:
    branches: ["main", "sprint/**", "fix/**"]
  pull_request:
    branches: ["main"]

env:
  PYTHONPATH: .
  AXIOM_API_TOKEN: test_token
  JWT_SECRET_KEY: ci-test-secret
  DATABASE_URL: "sqlite:///:memory:"
  DB_PATH: ":memory:"
  LOG_FORMAT: console
  LOG_LEVEL: WARNING

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint dependencies
        run: pip install ruff mypy pydantic pydantic-settings

      - name: Run ruff
        run: ruff check axiom/ tests/

      - name: Run mypy
        run: mypy axiom/ --ignore-missing-imports --no-strict-optional

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install \
            fastapi uvicorn pydantic pydantic-settings \
            networkx sympy pylatexenc requests \
            z3-solver anyio httpx \
            pytest pytest-cov pytest-anyio

      - name: Run test suite with coverage
        run: |
          pytest tests/ -v \
            --cov=axiom \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          file: coverage.xml
          fail_ci_if_error: false
