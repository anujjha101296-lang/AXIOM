name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install fastapi uvicorn sqlalchemy alembic aiosqlite pytest pytest-asyncio pydantic pydantic-settings networkx pypdf httpx pytest-cov

      - name: Run Python tests
        run: PYTHONPATH=. pytest tests/test_database.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Build UI
        working-directory: ./ui
        run: |
          npm install
          npm run build
