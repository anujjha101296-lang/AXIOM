name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install scientific runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn sqlalchemy alembic aiosqlite pytest pytest-asyncio pydantic pydantic-settings networkx pypdf httpx pytest-cov numpy scipy sympy pylatexenc requests passlib python-jose bcrypt email-validator python-multipart z3-solver google-generativeai openai openai-agents anyio

      - name: Run scientific runtime regression
        run: PYTHONPATH=. pytest tests/science_runtime -v

      - name: Run database regression
        run: PYTHONPATH=. pytest tests/test_database.py -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Build UI
        working-directory: ./ui
        run: |
          npm ci
          npm run build
