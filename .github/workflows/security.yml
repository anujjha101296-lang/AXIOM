name: Security — Dependency Audit

on:
  push:
    branches: ["main", "cursor/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"   # Every Monday at 06:00 UTC

jobs:
  python-audit:
    name: pip-audit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and pip-audit
        run: |
          pip install pip-audit
          pip install \
            fastapi uvicorn pydantic pydantic-settings \
            networkx sympy pylatexenc requests pypdf python-multipart \
            z3-solver anyio "httpx>=0.27.0,<0.28.0"

      - name: Run pip-audit
        run: pip-audit --desc on

      - name: Upload audit report
        if: always()
        run: pip-audit --format=json --output=audit-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-python
          path: audit-report.json

  ui-audit:
    name: npm audit (UI)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install and audit UI dependencies
        working-directory: ui
        run: |
          npm ci
          npm audit --audit-level=high
