<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chip War — Visual Edition</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#f7f7f5;font-family:Inter,system-ui,sans-serif;overflow:hidden}.stage{width:100vw;height:100vh;display:flex;align-items:center;justify-content:center;padding:3.5vh 3.5vw}.slide{width:min(94vw,1700px);height:min(92vh,960px);background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 50px rgba(0,0,0,.10);border-radius:18px;overflow:hidden}.slide img{width:100%;height:100%;object-fit:contain;background:#fff}.fallback{padding:40px;text-align:center;color:#555;font-size:18px}.hud{position:fixed;left:20px;right:20px;bottom:14px;display:flex;align-items:center;justify-content:space-between;pointer-events:none;color:#777;font-size:12px}.bar{position:fixed;left:0;bottom:0;height:3px;background:#222;transition:width .2s}.hint{opacity:.55}.btn{pointer-events:auto;border:0;background:rgba(255,255,255,.9);box-shadow:0 4px 16px rgba(0,0,0,.08);border-radius:999px;padding:8px 12px;cursor:pointer}.btn:hover{background:#fff}
</style></head><body><div class="stage"><div class="slide" id="slide"><div class="fallback">Loading real historical/technical image…</div></div></div><div class="hud"><span class="hint">← → / Space to navigate</span><span id="count"></span><button class="btn" id="fs">Fullscreen</button></div><div class="bar" id="bar"></div><script>
const rows = __ROWS__;
let i=0, cache=new Map();
function commons(q){return 'https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(q)+'&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url|mime&iiurlwidth=1800&format=json&origin=*'}
async function getImage(q){if(cache.has(q))return cache.get(q);try{let r=await fetch(commons(q));let j=await r.json();let pages=Object.values(j.query?.pages||{}).filter(x=>x.imageinfo?.[0]?.mime?.startsWith('image/'));let u=pages[0]?.imageinfo?.[0]?.thumburl||pages[0]?.imageinfo?.[0]?.url;if(u){cache.set(q,u);return u}}catch(e){}return null}
async function render(){let row=rows[i];document.getElementById('count').textContent=(i+1)+' / '+rows.length;document.getElementById('bar').style.width=((i+1)/rows.length*100)+'%';let box=document.getElementById('slide');box.innerHTML='<div class="fallback">Loading…</div>';let q=(row.keywords||row.topic||'semiconductor chip').split(',')[0]+' semiconductor';let u=await getImage(q);if(!u){box.innerHTML='<div class="fallback">No image found for this topic.</div>';return}let img=new Image();img.onload=()=>{box.innerHTML='';box.appendChild(img)};img.onerror=()=>{box.innerHTML='<div class="fallback">Image unavailable.</div>'};img.src=u;img.alt=''}
function next(){i=Math.min(rows.length-1,i+1);render()}function prev(){i=Math.max(0,i-1);render()}document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft'){e.preventDefault();prev()}if(e.key==='Home'){i=0;render()}if(e.key==='End'){i=rows.length-1;render()}});document.getElementById('fs').onclick=()=>document.documentElement.requestFullscreen?.();render();
</script></body></html>
