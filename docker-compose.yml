services:
  # ── AXIOM API Gateway ───────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: axiom-api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_FORMAT=json
      - LOG_LEVEL=INFO
      - DB_PATH=/data/axiom.db
      - LEAN_OUTPUT_DIR=/tmp/axiom_proofs
    env_file:
      - .env
    volumes:
      - axiom-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── AXIOM Next.js Frontend ──────────────────────────────────────────────────
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: axiom-ui
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ── Prometheus Metrics ──────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: axiom-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=30d"
    restart: unless-stopped

  # ── Grafana Dashboard ───────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: axiom-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=axiom-admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  axiom-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
