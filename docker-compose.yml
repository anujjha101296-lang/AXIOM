version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite+aiosqlite:////app/data/axiom.db
      - JWT_SECRET_KEY=axiom-production-jwt-secret-key-change-me
      - EMBEDDING_PROVIDER=test
    volumes:
      - axiom-data:/app/data
    restart: always

  frontend:
    build:
      context: ./ui
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always

volumes:
  axiom-data:
